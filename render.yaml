databases:
  - name: mars-it-postgres
    databaseName: mars_db
    user: mars_user
    plan: free

services:
  - type: web
    name: mars-it-platform
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mars-it-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_INITIAL_PASSWORD
        value: admin123
